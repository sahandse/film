<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#141414"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>Highfilm</title>

<!-- فونت ایران‌سنس -->
<style>
@font-face{
  font-family:'IranSans';
  src:url('https://cdn.fontcdn.ir/Font/Persian/IranSans/IranSansWeb.woff2') format('woff2'),
      url('https://cdn.fontcdn.ir/Font/Persian/IranSans/IranSansWeb.woff') format('woff');
  font-weight:400;font-display:swap;
}
@font-face{
  font-family:'IranSans';
  src:url('https://cdn.fontcdn.ir/Font/Persian/IranSans/IranSansWeb-Bold.woff2') format('woff2'),
      url('https://cdn.fontcdn.ir/Font/Persian/IranSans/IranSansWeb-Bold.woff') format('woff');
  font-weight:700 900;font-display:swap;
}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>

<style>
/* ══════════════════════════════════════════════════
   RESET & BASE
══════════════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#141414;
  --card:#1a1a1a;
  --surface:#242424;
  --accent:#e50914;
  --accent2:#b81d24;
  --text:#fff;
  --sub:#b3b3b3;
  --muted:#808080;
  --border:rgba(255,255,255,.1);
  --nav-h:60px;
  --safe:env(safe-area-inset-bottom,0px);
  --font:'IranSans','Vazirmatn',Tahoma,sans-serif;
}
html{scroll-behavior:smooth}
body{
  background:var(--bg);color:var(--text);
  font-family:var(--font);min-height:100vh;
  overflow-x:hidden;
  padding-bottom:calc(var(--nav-h) + var(--safe) + 4px);
}
::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#333;border-radius:2px}

/* ══════════════════════════════════════════════════
   LOADING BAR
══════════════════════════════════════════════════ */
#nbar{
  position:fixed;top:0;left:0;right:0;height:3px;z-index:9999;
  background:linear-gradient(90deg,var(--accent),#ff6b6b,#ff4444,var(--accent));
  background-size:300%;animation:nbar 1.5s linear infinite;display:none;
}
@keyframes nbar{0%{background-position:0% 0}100%{background-position:300% 0}}

/* ══════════════════════════════════════════════════
   HEADER
══════════════════════════════════════════════════ */
.header{
  position:fixed;top:0;right:0;left:0;z-index:500;
  padding:0 4%;height:68px;
  display:flex;align-items:center;gap:28px;
  transition:background .4s;
}
.header.scrolled{background:#141414}
.header::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(to bottom,rgba(0,0,0,.8) 0%,transparent 100%);
  pointer-events:none;
  opacity:1;transition:opacity .4s;
}
.header.scrolled::before{opacity:0}

.logo{
  font-size:28px;font-weight:900;letter-spacing:2px;
  color:var(--accent);text-shadow:0 0 20px rgba(229,9,20,.5);
  flex-shrink:0;cursor:pointer;position:relative;
}

.top-nav{display:none;gap:18px;flex:1}
@media(min-width:768px){.top-nav{display:flex}}
.top-nav a{
  font-size:13px;color:var(--sub);text-decoration:none;
  transition:color .2s;cursor:pointer;font-weight:500;
  white-space:nowrap;
}
.top-nav a:hover,.top-nav a.on{color:var(--text)}

.header-end{display:flex;align-items:center;gap:12px;margin-right:auto}
.icon-btn{
  width:36px;height:36px;border-radius:50%;background:none;
  border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;
  color:var(--sub);transition:color .2s;position:relative;
}
.icon-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2}
.icon-btn:hover{color:var(--text)}

/* ══════════════════════════════════════════════════
   HERO
══════════════════════════════════════════════════ */
.hero{
  position:relative;
  height:100vw;max-height:85vh;min-height:480px;
  display:flex;align-items:flex-end;overflow:hidden;
}
.hero-img{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;object-position:center top;
}
.hero-vignette{
  position:absolute;inset:0;
  background:
    linear-gradient(to top,var(--bg) 0%,rgba(20,20,20,.85) 30%,rgba(20,20,20,.3) 55%,rgba(20,20,20,.1) 75%,transparent 100%),
    linear-gradient(to left,transparent 40%,rgba(20,20,20,.85) 100%);
}
@media(min-width:768px){
  .hero{height:60vw;max-height:760px}
  .hero-vignette{
    background:
      linear-gradient(to top,var(--bg) 0%,rgba(20,20,20,.6) 25%,transparent 55%),
      linear-gradient(to left,transparent 30%,rgba(20,20,20,.95) 90%);
  }
}
.hero-content{
  position:relative;padding:0 4% 8%;max-width:680px;
}
@media(min-width:768px){.hero-content{padding:0 4% 10%}}

.hero-badge{
  display:inline-flex;align-items:center;gap:5px;
  background:var(--accent);color:#fff;
  font-size:11px;font-weight:700;
  padding:3px 10px;border-radius:4px;
  margin-bottom:12px;letter-spacing:.5px;
}
.hero-title{
  font-size:clamp(1.6rem,5vw,3.2rem);
  font-weight:900;color:#fff;line-height:1.1;
  margin-bottom:16px;
  text-shadow:2px 2px 12px rgba(0,0,0,.6);
}
.hero-meta{
  display:flex;align-items:center;gap:12px;
  font-size:13px;margin-bottom:14px;flex-wrap:wrap;
}
.hero-match{color:#46d369;font-weight:700}
.hero-dot{width:4px;height:4px;background:var(--sub);border-radius:50%}
.hero-desc{
  font-size:14px;color:rgba(255,255,255,.75);line-height:1.65;
  margin-bottom:22px;max-width:520px;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
}
@media(min-width:768px){.hero-desc{-webkit-line-clamp:4}}

.hero-btns{display:flex;gap:10px;flex-wrap:wrap}
.hbtn{
  display:inline-flex;align-items:center;gap:7px;
  border:none;cursor:pointer;border-radius:5px;
  font-family:var(--font);font-size:15px;font-weight:700;
  padding:10px 24px;transition:all .2s;
}
.hbtn-play{background:#fff;color:#000}
.hbtn-play:hover{background:rgba(255,255,255,.8)}
.hbtn-play svg{width:20px;height:20px;fill:#000}
.hbtn-info{background:rgba(109,109,110,.7);color:#fff;backdrop-filter:blur(4px)}
.hbtn-info:hover{background:rgba(109,109,110,.5)}
.hbtn-info svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2}

/* ══════════════════════════════════════════════════
   PAGES / TABS
══════════════════════════════════════════════════ */
.page{display:none}.page.on{display:block}
.pg-pad{padding-top:76px}

/* ══════════════════════════════════════════════════
   ROW
══════════════════════════════════════════════════ */
.row{margin-bottom:36px;position:relative}
.row-head{
  display:flex;align-items:baseline;gap:14px;
  padding:0 4%;margin-bottom:10px;cursor:pointer;
}
.row-head:hover .row-title{color:var(--text)}
.row-title{font-size:clamp(13px,1.4vw,17px);font-weight:700;color:var(--sub);transition:color .2s}
.row-more{font-size:11px;color:#54b9c5;opacity:0;transform:translateX(-6px);transition:all .2s}
.row-head:hover .row-more{opacity:1;transform:translateX(0)}
.row-arrow{display:flex;align-items:center;gap:4px}

/* SLIDER */
.slider{position:relative}
.slider-track{
  display:flex;gap:5px;padding:0 4%;
  overflow-x:auto;scroll-snap-type:x mandatory;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;
  scroll-padding:0 4%;
}
.slider-track::-webkit-scrollbar{display:none}

.sl-btn{
  position:absolute;top:0;bottom:0;width:4%;
  background:rgba(20,20,20,.6);border:none;cursor:pointer;
  display:none;align-items:center;justify-content:center;
  color:#fff;font-size:24px;z-index:10;
  transition:background .2s;
}
@media(min-width:600px){.sl-btn{display:flex}}
.sl-btn:hover{background:rgba(20,20,20,.9)}
.sl-prev{right:0;border-radius:0 4px 4px 0}
.sl-next{left:0;border-radius:4px 0 0 4px}
.sl-btn svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2.5}

/* ══════════════════════════════════════════════════
   CARD
══════════════════════════════════════════════════ */
.card{
  flex-shrink:0;
  width:calc((100vw - 8% - 20px) / 3);
  max-width:220px;min-width:110px;
  scroll-snap-align:start;
  border-radius:4px;overflow:visible;
  cursor:pointer;position:relative;
  transition:transform .2s,z-index 0s .2s;
  z-index:1;
}
@media(min-width:480px){.card{width:calc((100vw - 8% - 30px) / 4)}}
@media(min-width:640px){.card{width:calc((100vw - 8% - 40px) / 5)}}
@media(min-width:1024px){.card{width:calc((100vw - 8% - 60px) / 6)}}

.card:hover{transform:scale(1.22);z-index:100;transition:transform .25s .15s,z-index 0s .1s}
/* first/last child positioning to stay in viewport */
.slider-track .card:first-child:hover{transform:scale(1.22) translateX(-10%)}
.slider-track .card:last-child:hover{transform:scale(1.22) translateX(10%)}

.card-img{
  aspect-ratio:2/3;width:100%;
  object-fit:cover;border-radius:4px;
  display:block;background:#1a1a1a;
  transition:border-radius .25s .15s;
}
.card:hover .card-img{border-radius:4px 4px 0 0;transition:border-radius .1s}

.card-ph{
  aspect-ratio:2/3;width:100%;border-radius:4px;
  background:linear-gradient(145deg,#1f2937,#111827);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:6px;font-size:28px;color:#374151;
  transition:border-radius .25s .15s;
}
.card:hover .card-ph{border-radius:4px 4px 0 0}
.card-ph span{font-size:9px;color:var(--muted);text-align:center;padding:0 6px;line-height:1.4}

/* HOVER PANEL */
.card-hover-panel{
  position:absolute;right:0;left:0;
  background:#222;border-radius:0 0 5px 5px;
  padding:10px 10px 12px;
  opacity:0;pointer-events:none;
  transform:translateY(-4px);
  transition:opacity .15s,transform .15s;
  box-shadow:0 8px 30px rgba(0,0,0,.7);
  z-index:10;
}
.card:hover .card-hover-panel{
  opacity:1;pointer-events:all;transform:translateY(0);
  transition:opacity .2s .1s,transform .2s .1s;
}
.panel-btns{display:flex;gap:6px;align-items:center;margin-bottom:8px}
.pbtn{
  width:30px;height:30px;border-radius:50%;border:2px solid rgba(255,255,255,.6);
  background:rgba(0,0,0,.5);cursor:pointer;display:flex;align-items:center;justify-content:center;
  color:#fff;transition:border-color .15s,background .15s;flex-shrink:0;
}
.pbtn:hover{border-color:#fff;background:rgba(255,255,255,.1)}
.pbtn svg{width:14px;height:14px}
.pbtn-play{background:var(--text);border-color:var(--text);width:34px;height:34px}
.pbtn-play svg{fill:#000;stroke:none;width:16px;height:16px;margin-right:-2px}
.pbtn-play:hover{background:rgba(255,255,255,.8)}
.pbtn-more{margin-right:auto}
.pbtn-more svg{stroke:var(--text);fill:none;stroke-width:2}
.panel-title{font-size:12px;font-weight:700;color:#fff;margin-bottom:4px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.panel-meta{display:flex;align-items:center;gap:6px;font-size:10px;flex-wrap:wrap}
.pmatch{color:#46d369;font-weight:700}
.pbadge{
  border:1px solid var(--sub);color:var(--sub);
  padding:1px 4px;border-radius:2px;font-size:9px;
}
.pcat{font-size:10px;color:var(--sub)}

/* GRID (full page) */
.full-grid{
  display:grid;gap:5px;padding:0 4%;
  grid-template-columns:repeat(3,1fr);
}
@media(min-width:480px){.full-grid{grid-template-columns:repeat(4,1fr)}}
@media(min-width:640px){.full-grid{grid-template-columns:repeat(5,1fr)}}
@media(min-width:1024px){.full-grid{grid-template-columns:repeat(6,1fr)}}
.full-grid .card{width:100%;max-width:none;min-width:0;
  scroll-snap-align:none}

/* ══════════════════════════════════════════════════
   SKELETON
══════════════════════════════════════════════════ */
.skeleton{
  background:linear-gradient(90deg,#1e1e1e 0%,#2a2a2a 50%,#1e1e1e 100%);
  background-size:200%;animation:sk 1.6s infinite;border-radius:4px;
}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
.sk-row{padding:0 4%;margin-bottom:32px}
.sk-title{height:18px;width:140px;margin-bottom:12px}.sk-title{display:block}
.sk-cards{display:flex;gap:5px;overflow:hidden}
.sk-card{flex-shrink:0;width:calc((100vw - 8% - 20px) / 3);aspect-ratio:2/3}
@media(min-width:640px){.sk-card{width:calc((100vw - 8% - 40px) / 5)}}

/* ══════════════════════════════════════════════════
   PAGE HEADER (films / series pages)
══════════════════════════════════════════════════ */
.pg-head{
  padding:76px 4% 20px;
  background:linear-gradient(to bottom,rgba(20,20,20,.9) 0%,transparent 100%);
}
.pg-head h1{font-size:clamp(22px,3vw,32px);font-weight:900;color:#fff}
.pg-head p{font-size:13px;color:var(--sub);margin-top:4px}

/* ══════════════════════════════════════════════════
   BOTTOM NAV (mobile)
══════════════════════════════════════════════════ */
.bnav{
  position:fixed;bottom:0;left:0;right:0;z-index:600;
  height:calc(var(--nav-h)+var(--safe));
  padding-bottom:var(--safe);
  background:rgba(20,20,20,.97);backdrop-filter:blur(20px);
  border-top:1px solid rgba(255,255,255,.08);
  display:flex;
}
@media(min-width:768px){.bnav{display:none}}
.nbtn{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;border:none;background:none;cursor:pointer;
  color:var(--muted);font-family:var(--font);font-size:10px;font-weight:600;
  transition:color .2s;padding:6px 0;
}
.nbtn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;transition:all .2s}
.nbtn.on{color:var(--text)}
.nbtn.on svg{stroke:var(--text)}

/* ══════════════════════════════════════════════════
   SEARCH
══════════════════════════════════════════════════ */
.search-ovl{
  position:fixed;inset:0;z-index:700;
  background:var(--bg);opacity:0;pointer-events:none;
  transition:opacity .2s;padding:16px;
  padding-top:calc(68px + 8px);
}
.search-ovl.on{opacity:1;pointer-events:all}
.sinput-wrap{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.sinput{
  flex:1;background:#333;border:none;border-radius:4px;
  padding:10px 16px;font-family:var(--font);font-size:15px;color:var(--text);
  outline:none;text-align:right;
}
.sinput::placeholder{color:var(--muted)}
.sclose-btn{background:none;border:none;color:var(--sub);cursor:pointer;
  font-family:var(--font);font-size:13px;padding:8px}
#sresults{
  display:grid;gap:5px;
  grid-template-columns:repeat(3,1fr);
  overflow-y:auto;max-height:calc(100vh - 130px);
}
@media(min-width:480px){#sresults{grid-template-columns:repeat(4,1fr)}}
@media(min-width:640px){#sresults{grid-template-columns:repeat(5,1fr)}}

/* ══════════════════════════════════════════════════
   MODAL / PLAYER
══════════════════════════════════════════════════ */
.movl{
  position:fixed;inset:0;z-index:800;
  background:rgba(0,0,0,.8);backdrop-filter:blur(8px);
  display:flex;align-items:flex-end;
  opacity:0;pointer-events:none;transition:opacity .25s;
}
@media(min-width:640px){.movl{align-items:center;padding:24px}}
.movl.on{opacity:1;pointer-events:all}

.modal{
  width:100%;background:#181818;
  border-radius:8px 8px 0 0;overflow:hidden;
  max-height:96vh;overflow-y:auto;
  transform:translateY(60px);transition:transform .3s;
  scrollbar-width:none;
}
.modal::-webkit-scrollbar{display:none}
@media(min-width:640px){
  .modal{border-radius:8px;max-width:860px;margin:auto;transform:scale(.93)}
}
.movl.on .modal{transform:translateY(0)}
@media(min-width:640px){.movl.on .modal{transform:scale(1)}}

.modal-hero{position:relative;aspect-ratio:16/9;background:#000;overflow:hidden}
.modal-hero iframe{position:absolute;inset:0;width:100%;height:100%;border:none}
.modal-hero-img{width:100%;height:100%;object-fit:cover;display:block}
.modal-hero-overlay{
  position:absolute;inset:0;
  background:linear-gradient(to top,#181818 0%,rgba(24,24,24,.5) 60%,transparent 100%);
  display:flex;align-items:flex-end;padding:20px;gap:10px;
}
.mclose-hero{
  position:absolute;top:14px;left:14px;
  width:34px;height:34px;border-radius:50%;
  background:rgba(24,24,24,.8);border:2px solid rgba(255,255,255,.3);
  cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff;
  transition:background .2s;
}
.mclose-hero:hover{background:#181818;border-color:#fff}
.mclose-hero svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.5}
.mplay-hero{
  width:44px;height:44px;border-radius:50%;background:var(--text);
  border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:background .2s;flex-shrink:0;
}
.mplay-hero:hover{background:rgba(255,255,255,.8)}
.mplay-hero svg{width:20px;height:20px;fill:#000;margin-right:-2px}
.mplay-hero.playing{background:var(--accent)}
.mplay-hero.playing svg{fill:#fff}

.modal-body{padding:20px 24px 28px}
.modal-title{font-size:clamp(16px,2.5vw,24px);font-weight:900;color:#fff;margin-bottom:10px}
.modal-meta{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.m-match{color:#46d369;font-weight:700;font-size:14px}
.m-year,.m-dur{font-size:13px;color:var(--sub)}
.m-hd{border:1px solid var(--sub);border-radius:3px;font-size:10px;padding:1px 5px;color:var(--sub)}
.modal-btns{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.mbtn{
  display:inline-flex;align-items:center;gap:7px;
  border:none;cursor:pointer;border-radius:4px;
  font-family:var(--font);font-size:13px;font-weight:700;
  padding:9px 20px;transition:all .2s;
}
.mbtn-play{background:#fff;color:#000}
.mbtn-play:hover{background:rgba(255,255,255,.8)}
.mbtn-play svg{width:17px;height:17px;fill:#000}
.mbtn-site{background:rgba(109,109,110,.7);color:#fff;border:1px solid rgba(255,255,255,.2)}
.mbtn-site:hover{background:rgba(109,109,110,.5)}
.mbtn-site svg{width:15px;height:15px;stroke:#fff;fill:none;stroke-width:2}
.modal-desc{font-size:13px;color:var(--sub);line-height:1.7;margin-bottom:14px}
.modal-tags{display:flex;flex-wrap:wrap;gap:6px}
.mtag{
  font-size:11px;padding:3px 10px;border-radius:20px;
  background:rgba(255,255,255,.08);color:var(--sub);
}

/* ══════════════════════════════════════════════════
   EMPTY / STATUS
══════════════════════════════════════════════════ */
.no-content{
  text-align:center;padding:60px 24px;color:var(--muted);
}
.no-content .icon{font-size:48px;margin-bottom:12px}
.no-content p{font-size:14px;line-height:1.7}
.no-content a{color:var(--accent);text-decoration:none}

/* ══════════════════════════════════════════════════
   DRAG INDICATOR (mobile modal)
══════════════════════════════════════════════════ */
.drag-bar{
  width:36px;height:4px;background:rgba(255,255,255,.2);
  border-radius:2px;margin:10px auto 0;
}
@media(min-width:640px){.drag-bar{display:none}}
</style>
</head>
<body>

<div id="nbar"></div>

<!-- ══ HEADER ══ -->
<header class="header" id="header">
  <span class="logo" onclick="go('home')">Highfilm</span>

  <nav class="top-nav" id="top-nav">
    <a class="on" data-pg="home" onclick="go('home')">خانه</a>
    <a data-pg="movies" onclick="go('movies')">فیلم‌ها</a>
    <a data-pg="series" onclick="go('series')">سریال‌ها</a>
    <a onclick="showAll('animation')">انیمیشن</a>
    <a onclick="showAll('anime')">انیمه</a>
    <a onclick="showAll('korean')">کره‌ای</a>
    <a onclick="showAll('turkish')">ترکی</a>
  </nav>

  <div class="header-end">
    <button class="icon-btn" onclick="openSearch()" title="جستجو">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    </button>

<script>
// ════════════════════════════════════════════════════════════════
//  CONFIG
// ════════════════════════════════════════════════════════════════
const SITE = 'https://serialblog1.top';

const CATS = [
  {
    id:'latest-movie', label:'جدیدترین فیلم‌ها', icon:'🎬',
    badge:'فیلم', badgeColor:'#e50914',
    urls:['/category/film/','/category/movie/','/category/films/','/']
  },
  {
    id:'latest-series', label:'جدیدترین سریال‌ها', icon:'📺',
    badge:'سریال', badgeColor:'#3b82f6',
    urls:['/category/serial/','/category/series/','/']
  },
  {
    id:'animation', label:'انیمیشن', icon:'🎭',
    badge:'انیمیشن', badgeColor:'#8b5cf6',
    urls:['/category/animation/','/category/animated/','/category/cartoon/','/category/%D8%A7%D9%86%DB%8C%D9%85%DB%8C%D8%B4%D9%86/']
  },
  {
    id:'anime', label:'انیمه', icon:'⛩️',
    badge:'انیمه', badgeColor:'#ec4899',
    urls:['/category/anime/','/category/%D8%A7%D9%86%DB%8C%D9%85%D9%87/']
  },
  {
    id:'korean', label:'سریال کره‌ای', icon:'🇰🇷',
    badge:'کره‌ای', badgeColor:'#22c55e',
    urls:['/category/serial-koreaei/','/category/korean/','/category/koreans/']
  },
  {
    id:'turkish', label:'سریال ترکی', icon:'🇹🇷',
    badge:'ترکی', badgeColor:'#f97316',
    urls:['/category/serial-torki/','/category/turkish/','/category/turkey/']
  },
];

// CORS proxies
const PROXIES = [
  u => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
  u => `https://corsproxy.io/?${encodeURIComponent(u)}`,
  u => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(u)}`,
];

// ════════════════════════════════════════════════════════════════
//  STATE
// ════════════════════════════════════════════════════════════════
let STORE = {};
let ALL   = [];
let _uid  = 0;
let _featured = null;
let _activeItem = null;
let _isPlaying  = false;

// ════════════════════════════════════════════════════════════════
//  FETCH
// ════════════════════════════════════════════════════════════════
async function fetchHTML(paths) {
  for (const path of paths) {
    const url = SITE + path;
    // Direct
    try {
      const r = await fetch(url, {signal: AbortSignal.timeout(5000)});
      if (r.ok) return await r.text();
    } catch {}
    // Proxies
    for (const proxy of PROXIES) {
      try {
        const r = await fetch(proxy(url), {signal: AbortSignal.timeout(7000)});
        if (r.ok) {
          const t = await r.text();
          if (t.length > 300 && !t.includes('"error"')) return t;
        }
      } catch {}
    }
  }
  return null;
}

// ════════════════════════════════════════════════════════════════
//  PARSE
// ════════════════════════════════════════════════════════════════
function parseItems(html, catId) {
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const items = [];

  const artSels = ['article','article.post','.post-item','.movie-item','.film-item','.item','.entry','.archive-item'];
  let articles = [];
  for (const s of artSels) {
    const found = [...doc.querySelectorAll(s)];
    if (found.length >= 2) { articles = found; break; }
  }
  if (!articles.length) {
    articles = [...doc.querySelectorAll('li')].filter(l => l.querySelector('img') && l.querySelector('a'));
  }

  for (const el of articles) {
    const titleEl = el.querySelector(
      'h2 a,h3 a,h4 a,.entry-title a,.post-title a,.title a,a[rel="bookmark"],.film-title a'
    );
    const title = titleEl?.textContent?.trim();
    if (!title || title.length < 2) continue;

    const link = titleEl?.href || el.querySelector('a')?.href || '';
    if (!link || link === location.href) continue;

    const imgEl = el.querySelector(
      'img.wp-post-image,img.attachment-post-thumbnail,.thumbnail img,.thumb img,.cover img,.post-thumbnail img,figure img,img[loading],img'
    );
    let cover = imgEl?.dataset?.src || imgEl?.dataset?.lazy || imgEl?.src
      || imgEl?.getAttribute('data-original') || '';
    if (cover?.startsWith('/')) cover = SITE + cover;
    if (cover && !cover.startsWith('http')) cover = '';
    if (cover && /avatar|emoji|logo|icon/i.test(cover)) cover = '';

    // Extract description if available
    const descEl = el.querySelector('.entry-summary,.excerpt,.post-excerpt,.summary,p');
    const desc = descEl?.textContent?.trim() || '';

    items.push({ id: ++_uid, title, cover, link, catId, desc: desc.slice(0, 200) });
  }
  return items.slice(0, 20);
}

// ════════════════════════════════════════════════════════════════
//  CARD HTML
// ════════════════════════════════════════════════════════════════
function cat(id) { return CATS.find(c => c.id === id); }

function cardHTML(m) {
  const c = cat(m.catId);
  const img = m.cover
    ? `<img class="card-img" src="${m.cover}" loading="lazy" alt="" decoding="async"
         onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
    : '';
  const ph = `<div class="card-ph" style="${m.cover?'display:none':''}">
    <span style="font-size:32px">${c?.icon||'🎬'}</span>
    <span>${m.title}</span>
  </div>`;

  return `<div class="card" onclick="openItem(${m.id})">
    ${img}${ph}
    <div class="card-hover-panel">
      <div class="panel-btns">
        <button class="pbtn pbtn-play" onclick="event.stopPropagation();playNow(${m.id})">
          <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button class="pbtn pbtn-more" onclick="event.stopPropagation();openItem(${m.id})" title="اطلاعات بیشتر">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="m15 9-3 3-3-3M12 12v6"/></svg>
        </button>
      </div>
      <div class="panel-title">${m.title}</div>
      <div class="panel-meta">
        <span class="pmatch">جدید</span>
        <span class="pbadge" style="border-color:${c?.badgeColor||'#fff'};color:${c?.badgeColor||'#fff'}">${c?.badge||''}</span>
        <span class="pcat">${c?.icon||''} ${c?.label||''}</span>
      </div>
    </div>
  </div>`;
}

// ════════════════════════════════════════════════════════════════
//  SLIDER
// ════════════════════════════════════════════════════════════════
function sliderHTML(catObj, items) {
  const cards = items.map(cardHTML).join('');
  return `<div class="row" id="row-${catObj.id}">
    <div class="row-head" onclick="showAll('${catObj.id}')">
      <h3 class="row-title">${catObj.icon} ${catObj.label}</h3>
      <span class="row-more">مشاهده همه <svg style="width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2.5;display:inline" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></span>
    </div>
    <div class="slider" id="sl-${catObj.id}">
      <div class="slider-track" id="st-${catObj.id}">${cards}</div>
      <button class="sl-btn sl-prev" onclick="slide('${catObj.id}',-1)">
        <svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>
      </button>
      <button class="sl-btn sl-next" onclick="slide('${catObj.id}',1)">
        <svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
      </button>
    </div>
  </div>`;
}

function slide(catId, dir) {
  const track = document.getElementById('st-' + catId);
  if (!track) return;
  const cardW = track.querySelector('.card')?.offsetWidth || 150;
  track.scrollBy({ left: dir * cardW * 3 * -1, behavior: 'smooth' });
}

// ════════════════════════════════════════════════════════════════
//  HERO
// ════════════════════════════════════════════════════════════════
function renderHero(m) {
  _featured = m;
  if (!m) return;
  const c = cat(m.catId);
  const imgEl = document.getElementById('hero-img');
  if (m.cover) { imgEl.src = m.cover; imgEl.style.display = ''; }
  else imgEl.style.display = 'none';

  document.getElementById('hero-content').innerHTML = `
    <div class="hero-badge">${c?.icon||''} ${c?.badge||''}</div>
    <h1 class="hero-title">${m.title}</h1>
    <div class="hero-meta">
      <span class="hero-match">۹۷٪ تطابق</span>
      <span class="hero-dot"></span>
      <span style="color:var(--sub)">جدید</span>
      <span class="hero-dot"></span>
      <span class="hero-hd" style="border:1px solid rgba(255,255,255,.5);padding:1px 6px;border-radius:3px;font-size:11px;color:var(--sub)">HD</span>
    </div>
    ${m.desc ? `<p class="hero-desc">${m.desc}</p>` : ''}
    <div class="hero-btns">
      <button class="hbtn hbtn-play" onclick="playNow(${m.id})">
        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        پخش
      </button>
      <button class="hbtn hbtn-info" onclick="openItem(${m.id})">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
        اطلاعات بیشتر
      </button>
    </div>`;
}

// ════════════════════════════════════════════════════════════════
//  SHOW ALL (category page)
// ════════════════════════════════════════════════════════════════
function showAll(catId) {
  if (catId === 'latest-movie') { go('movies'); return; }
  if (catId === 'latest-series') { go('series'); return; }

  const c = cat(catId);
  const items = STORE[catId] || [];

  document.querySelectorAll('.page').forEach(p => p.classList.remove('on'));
  document.querySelectorAll('.nbtn,.top-nav a').forEach(b => b.classList.remove('on'));

  let pg = document.getElementById('pg-cat-' + catId);
  if (!pg) {
    pg = document.createElement('div');
    pg.className = 'page';
    pg.id = 'pg-cat-' + catId;
    pg.innerHTML = `
      <div class="pg-head" style="display:flex;align-items:center;gap:12px">
        <button onclick="go('home')" style="background:none;border:none;color:var(--sub);
          cursor:pointer;font-size:22px;font-family:var(--font)">‹</button>
        <div>
          <h1>${c?.icon} ${c?.label}</h1>
          <p>${items.length} مورد</p>
        </div>
      </div>
      <div class="full-grid">${items.map(cardHTML).join('')}</div>`;
    document.querySelector('.bnav').before(pg);
  }
  pg.classList.add('on');
  window.scrollTo(0,0);
}

// ════════════════════════════════════════════════════════════════
//  FULL PAGE GRIDS
// ════════════════════════════════════════════════════════════════
function updateFullPages() {
  const movies = STORE['latest-movie'] || [];
  const series = STORE['latest-series'] || [];

  document.getElementById('movies-grid').innerHTML = movies.length
    ? movies.map(cardHTML).join('')
    : '<div class="no-content"><div class="icon">🎬</div><p>در حال بارگذاری...</p></div>';
  document.getElementById('movies-sub').textContent = movies.length ? `${movies.length} فیلم` : 'در حال بارگذاری...';

  document.getElementById('series-grid').innerHTML = series.length
    ? series.map(cardHTML).join('')
    : '<div class="no-content"><div class="icon">📺</div><p>در حال بارگذاری...</p></div>';
  document.getElementById('series-sub').textContent = series.length ? `${series.length} سریال` : 'در حال بارگذاری...';
}

// ════════════════════════════════════════════════════════════════
//  MODAL / PLAYER
// ════════════════════════════════════════════════════════════════
function openItem(id) {
  const m = ALL.find(x => x.id === id);
  if (!m) return;
  _activeItem = m;
  _isPlaying = false;

  const c = cat(m.catId);

  // Modal hero
  const coverEl = document.getElementById('modal-cover');
  const playerEl = document.getElementById('modal-player');
  const iframeEl = document.getElementById('iframe');

  iframeEl.src = '';
  playerEl.style.display = 'none';
  if (m.cover) { coverEl.src = m.cover; coverEl.style.display = 'block'; }
  else coverEl.style.display = 'none';

  // Play button state
  const mplay = document.getElementById('mplay-btn');
  mplay.classList.remove('playing');
  mplay.innerHTML = `<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>`;

  document.getElementById('modal-title').textContent = m.title;
  document.getElementById('modal-meta').innerHTML = `
    <span class="m-match">۹۷٪ تطابق</span>
    <span class="m-year">جدید</span>
    <span class="m-hd">HD</span>
    <span style="font-size:12px;color:var(--sub);border:1px solid var(--sub);padding:1px 6px;border-radius:3px">${c?.badge||''}</span>`;
  document.getElementById('modal-btns').innerHTML = `
    <button class="mbtn mbtn-play" onclick="togglePlay()">
      <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>پخش
    </button>
    <button class="mbtn mbtn-site" onclick="window.open('${m.link}','_blank')">
      <svg viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
      مشاهده در سایت
    </button>`;
  document.getElementById('modal-desc').textContent = m.desc || 'برای مشاهده اطلاعات بیشتر روی «مشاهده در سایت» بزنید.';
  document.getElementById('modal-tags').innerHTML =
    `<span class="mtag">${c?.icon} ${c?.label}</span>
     <span class="mtag">جدید</span>
     <span class="mtag">HD</span>`;

  document.getElementById('movl').classList.add('on');
  document.body.style.overflow = 'hidden';
}

function playNow(id) {
  openItem(id);
  setTimeout(togglePlay, 300);
}

function togglePlay() {
  if (!_activeItem) return;
  _isPlaying = !_isPlaying;

  const coverEl = document.getElementById('modal-cover');
  const playerEl = document.getElementById('modal-player');
  const iframeEl = document.getElementById('iframe');
  const mplay   = document.getElementById('mplay-btn');

  if (_isPlaying) {
    iframeEl.src = _activeItem.link;
    coverEl.style.display = 'none';
    playerEl.style.display = 'block';
    mplay.classList.add('playing');
    mplay.innerHTML = `<svg viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>`;
  } else {
    iframeEl.src = '';
    playerEl.style.display = 'none';
    coverEl.style.display = 'block';
    mplay.classList.remove('playing');
    mplay.innerHTML = `<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>`;
  }
}

function closePlayer() {
  _isPlaying = false;
  document.getElementById('iframe').src = '';
  document.getElementById('modal-player').style.display = 'none';
  document.getElementById('movl').classList.remove('on');
  document.body.style.overflow = '';
}

function bgClose(e) { if (e.target.id === 'movl') closePlayer(); }
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closePlayer(); closeSearch(); }
});

// ════════════════════════════════════════════════════════════════
//  NAV
// ════════════════════════════════════════════════════════════════
function go(pg) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('on'));
  document.querySelectorAll('.nbtn,.top-nav a').forEach(b => b.classList.remove('on'));
  document.getElementById('pg-' + pg)?.classList.add('on');
  document.querySelectorAll(`[data-pg="${pg}"]`).forEach(el => el.classList.add('on'));
  window.scrollTo(0,0);
}

// Header scroll effect
window.addEventListener('scroll', () => {
  document.getElementById('header').classList.toggle('scrolled', window.scrollY > 60);
}, {passive:true});

// ════════════════════════════════════════════════════════════════
//  SEARCH
// ════════════════════════════════════════════════════════════════
function openSearch() {
  document.getElementById('sovl').classList.add('on');
  setTimeout(() => document.getElementById('sinput').focus(), 80);
}
function closeSearch() {
  document.getElementById('sovl').classList.remove('on');
  document.getElementById('sinput').value = '';
  document.getElementById('sresults').innerHTML = '<p style="color:var(--muted);font-size:13px;text-align:center;padding:24px">عنوان مورد نظر را تایپ کنید</p>';
}
function doSearch(q) {
  const el = document.getElementById('sresults');
  const term = q.trim();
  if (!term) {
    el.innerHTML = '<p style="color:var(--muted);font-size:13px;text-align:center;padding:24px">عنوان مورد نظر را تایپ کنید</p>';
    return;
  }
  const res = ALL.filter(m => m.title.includes(term));
  el.innerHTML = res.length
    ? res.map(cardHTML).join('')
    : '<div class="no-content"><div class="icon">🔍</div><p>نتیجه‌ای یافت نشد</p></div>';
}

// ════════════════════════════════════════════════════════════════
//  LOADING
// ════════════════════════════════════════════════════════════════
let _loads = 0;
function setLoad(on) {
  _loads += on ? 1 : -1;
  document.getElementById('nbar').style.display = _loads > 0 ? 'block' : 'none';
}

// ════════════════════════════════════════════════════════════════
//  INIT
// ════════════════════════════════════════════════════════════════
async function init() {
  const homeContent = document.getElementById('home-content');

  // Load all categories concurrently
  await Promise.allSettled(CATS.map(async (catObj, i) => {
    setLoad(true);
    try {
      const html = await fetchHTML(catObj.urls);
      if (!html) return;

      const items = parseItems(html, catObj.id);
      if (!items.length) return;

      STORE[catObj.id] = items;
      ALL = [...ALL, ...items];

      // Hero: use first movie or series
      if (!_featured && (catObj.id === 'latest-movie' || catObj.id === 'latest-series')) {
        renderHero(items[0]);
      }

      // Inject row into home
      const rowDiv = document.createElement('div');
      rowDiv.innerHTML = sliderHTML(catObj, items.slice(0, 16));
      homeContent.appendChild(rowDiv.firstElementChild);

      // Update full pages
      updateFullPages();

    } catch(e) { console.warn(catObj.id, e); }
    finally { setLoad(false); }
  }));

  // Remove skeletons
  document.querySelectorAll('.sk-row').forEach(el => el.remove());

  if (ALL.length === 0) {
    renderHero(null);
    document.getElementById('hero-content').innerHTML = `
      <div class="hero-badge">Highfilm</div>
      <h1 class="hero-title">خوش آمدید</h1>
      <div class="hero-btns">
        <button class="hbtn hbtn-info" onclick="window.open('${SITE}','_blank')">
          <svg viewBox="0 0 24 24" style="stroke:#fff;fill:none;stroke-width:2;width:16px;height:16px"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
          رفتن به سایت اصلی
        </button>
      </div>`;
    homeContent.innerHTML = `
      <div class="no-content" style="padding:60px 24px">
        <div class="icon">🌐</div>
        <p>محتوا بارگذاری نشد.<br/>
        ممکن است سایت بلوک باشد یا اتصال اینترنت قطع باشد.<br/><br/>
        <a href="${SITE}" target="_blank">مستقیم به سایت بروید ›</a></p>
      </div>`;
  }
}

init();
</script>
</body>
</html>
